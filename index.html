<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawler Medical University – Case Sheets</title>
<style>
:root{
  --ink:#1c2733; --muted:#5d6b7a; --navy:#16406e; --red:#b3141f;
  --paper:#ffffff; --bg:#eef1f5; --line:#9fb3c8; --soft:#f6f8fb; --ok:#1d7a4d;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#e6ebf1; --muted:#9aa8b8; --navy:#8fb8ea; --red:#ff7b83;
    --paper:#18212b; --bg:#0f151c; --line:#3d4f63; --soft:#1e2935; --ok:#59c98f; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:12px}
.bar{display:flex;gap:6px;background:var(--paper);border:1px solid var(--line);
  border-radius:10px;padding:6px;position:sticky;top:0;z-index:5}
.bar button{flex:1;border:0;background:transparent;color:var(--ink);padding:10px 6px;
  border-radius:7px;font:inherit;font-weight:600;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--navy);color:#fff}
@media (prefers-color-scheme: dark){.bar button[aria-pressed="true"]{color:#0f151c}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--red);outline-offset:1px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:10px;
  margin-top:12px;padding:22px 22px 28px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  border-bottom:2px solid var(--navy);padding-bottom:12px}
.head .uni{font-size:1.05rem;font-weight:700;line-height:1.35}
.head .uni span{display:block;font-weight:500;color:var(--muted);font-size:.95rem}
.crest{width:92px;height:auto;flex:none;background:#fff;border-radius:6px}
.title{text-align:center;margin:18px 0 4px;font-size:1.35rem;font-weight:700;color:var(--navy)}
.title.long{color:var(--navy)}
.no{text-align:center;color:var(--ink);margin:0 0 18px;font-weight:600}
.no input{width:90px;display:inline-block;text-align:center;margin:0 0 0 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media (max-width:640px){.grid{grid-template-columns:1fr}.sheet{padding:16px 14px 22px}}
label.f{display:block;font-weight:600;color:var(--navy);font-size:.92rem}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;font:inherit;color:var(--ink);background:var(--soft);
  border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:3px}
textarea{resize:none;overflow:hidden;min-height:44px;line-height:1.55}
h2{font-size:1.08rem;margin:26px 0 6px;color:var(--red);padding-bottom:4px;border-bottom:1px solid var(--line)}
h3{font-size:.98rem;margin:16px 0 2px;color:var(--navy)}
.field{margin-top:12px}
.vitals{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:640px){.vitals{grid-template-columns:repeat(2,1fr)}}
.vitals span{font-weight:400;color:var(--muted)}
.sign{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
@media (max-width:640px){.sign{grid-template-columns:1fr}}
.prep{margin:26px 0 0;text-align:center;color:var(--muted);font-weight:600}
.yn{display:flex;gap:18px;align-items:center;margin-top:18px;font-weight:600;color:var(--navy)}
.yn label{display:flex;gap:6px;align-items:center;font-weight:500;color:var(--ink)}
.yn input{width:20px;height:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.btn{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:11px 18px;
  border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#0f151c}}
.btn.alt{background:transparent;color:var(--navy)}
.msg{min-height:1.4em;margin-top:8px;color:var(--ok);font-weight:600}
.saved{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin-top:12px;padding:16px 18px}
.saved h2{margin-top:0;color:var(--navy)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{display:block}.row small{color:var(--muted)}
.row button{border:1px solid var(--line);background:transparent;color:var(--ink);
  padding:7px 12px;border-radius:6px;font:inherit;cursor:pointer;margin-left:6px}
.row button.del{color:var(--red)}
.empty{color:var(--muted)}
@page{size:A4;margin:14mm}
@media print{
  body{background:#fff;color:#000}
  .noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .sheet{border:0;margin:0;padding:0;background:#fff}
  :root{--ink:#000;--navy:#16406e;--red:#b3141f;--line:#888;--soft:#fff;--paper:#fff;--muted:#444}
  select{-webkit-appearance:none;appearance:none}
  input,select,textarea{border:0!important;border-bottom:1px dotted #666!important;border-radius:0!important;
    background:#fff!important;padding:2px 0!important}
  h2,.field,.vitals,.sign,.yn,.prep{break-inside:avoid}
}
</style>
</head>
<body>
<div class="wrap">
  <nav class="bar noprint" aria-label="Case type">
    <button data-t="short">Short case</button>
    <button data-t="long">Long case</button>
    <button data-t="ccu">CCU / ED / Clinic</button>
  </nav>

  <form class="sheet" id="sheet" onsubmit="return false"></form>

  <div class="noprint">
    <div class="actions">
      <button class="btn" id="save" type="button">Save case</button>
      <button class="btn alt" id="new" type="button">New case</button>
      <button class="btn alt" id="pdf" type="button">Save as PDF</button>
    </div>
    <div class="msg" id="msg" role="status"></div>
    <section class="saved">
      <h2>Saved cases</h2>
      <div id="list"></div>
    </section>
  </div>
</div>

    if(sec.vitals){
      h += '<h3>Vital signs</h3><div class="vitals">'+VITALS.map(function(v){
        return '<div><label class="f">'+v[1]+' <span>('+v[2]+')</span><input type="text" inputmode="decimal" data-k="v_'+v[0]+'"></label></div>';
      }).join("")+'</div>';
    }
    sec.f.forEach(function(f){h += area(f[0],f[1],f[2])});
  });
  h += '<div class="sign"><div><label class="f">Student name & signature<input type="text" data-k="student"></label></div>';
  h += '<div><label class="f">Date<input type="date" data-k="sdate"></label></div>';
  h += '<div><label class="f">Supervisor name, signature & stamp<input type="text" data-k="sup" placeholder="Dr."></label></div></div>';
  if(T.yn) h += '<div class="yn">Is this case presented?<label><input type="radio" name="pres" value="Yes" data-k="pres">Yes</label><label><input type="radio" name="pres" value="No" data-k="pres">No</label></div>';
  h += '<p class="prep">Prepared by '+PREPARED+'</p>';
  form.innerHTML = h;
  Array.prototype.forEach.call(form.querySelectorAll("textarea"),function(t){
    t.addEventListener("input",function(){grow(t)});
  });
  document.title = T.label.split(" (")[0] + " – Hawler Medical University";
  Array.prototype.forEach.call(document.querySelectorAll(".bar button"),function(b){
    b.setAttribute("aria-pressed", b.getAttribute("data-t")===cur ? "true":"false");
  });
}
function grow(t){t.style.height="auto";t.style.height=(t.scrollHeight+2)+"px"}
function growAll(){Array.prototype.forEach.call(form.querySelectorAll("textarea"),grow)}

function collect(){
  var d = {};
  Array.prototype.forEach.call(form.querySelectorAll("[data-k]"),function(e){
    if(e.type==="radio"){ if(e.checked) d[e.getAttribute("data-k")] = e.value; }
    else d[e.getAttribute("data-k")] = e.value;
  });
  return d;
}
function fill(d){
  Array.prototype.forEach.call(form.querySelectorAll("[data-k]"),function(e){
    var k = e.getAttribute("data-k");
    if(e.type==="radio") e.checked = (d[k]===e.value);
    else if(d[k]!==undefined) e.value = d[k];
  });
  growAll();
}

function load(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return []}}
function store(a){try{localStorage.setItem(KEY,JSON.stringify(a));return true}catch(e){return false}}
function say(t){var m=document.getElementById("msg");m.textContent=t;
  clearTimeout(say.t);say.t=setTimeout(function(){m.textContent=""},3500)}

function renderList(){
  var a = load(), el = document.getElementById("list");
  if(!a.length){el.innerHTML='<p class="empty">No saved cases yet. Fill in a sheet and press Save case.</p>';return}
  el.innerHTML = a.map(function(c){
    var nm = (c.data.name||"").trim() || "Unnamed patient";
    return '<div class="row"><div><b>'+esc(nm)+'</b><small>'+TYPES[c.type].label.split(" (")[0]+' · saved '+esc(c.saved)+'</small></div>'+
      '<div><button type="button" data-open="'+c.id+'">Open</button><button type="button" class="del" data-del="'+c.id+'">Delete</button></div></div>';
  }).join("");
}

document.querySelector(".bar").addEventListener("click",function(e){
  var t = e.target.getAttribute("data-t");
  if(!t || t===cur) return;
  var d = collect(); cur = t; build();
  // keep patient details when switching type
  var keep = {}; DETAILS_L.concat(DETAILS_R).forEach(function(x){keep[x[0]]=d[x[0]]});
  keep.caseno = d.caseno; keep.student = d.student; keep.sdate = d.sdate; keep.sup = d.sup;
  fill(keep);
});
document.getElementById("save").addEventListener("click",function(){
  var a = load(), d = collect(), now = new Date().toLocaleString();
  if(editId){
    a = a.map(function(c){return c.id===editId ? {id:c.id,type:cur,data:d,saved:now} : c});
  } else {
    editId = String(Date.now());
    a.unshift({id:editId,type:cur,data:d,saved:now});
  }
  say(store(a) ? "Case saved." : "Could not save. The browser blocked storage.");
  renderList();
});
document.getElementById("new").addEventListener("click",function(){
  editId = null; build(); window.scrollTo(0,0); say("New case ready.");
});
document.getElementById("pdf").addEventListener("click",function(){
  growAll(); window.print();
});
document.getElementById("list").addEventListener("click",function(e){
  var o = e.target.getAttribute("data-open"), x = e.target.getAttribute("data-del");
  var a = load();
  if(o){
    var c = a.filter(function(i){return i.id===o})[0];
    if(c){cur = c.type; editId = c.id; build(); fill(c.data); window.scrollTo(0,0)}
  }
  if(x){
    if(!confirm("Delete this saved case?")) return;
    store(a.filter(function(i){return i.id!==x}));
    if(editId===x) editId = null;
    renderList();
  }
});

build(); renderList();
</script>
</body>
</html>
